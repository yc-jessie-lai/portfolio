title: Yu-Ching Lai
description: Geomatics and systems engineering. Remote sensing, GIS, sensing, simulation and optimization.

# If the repository is named <username>.github.io, leave baseurl empty.
# If it is any other name (e.g. "portfolio"), set baseurl: "/portfolio".
url: ""
baseurl: "/portfolio"

author:
  name: Yu-Ching Lai
  tagline: Systems Engineering M.S. student at UC Berkeley, with a B.S. in Geomatics from NCKU.
  intro: >-
    My background spans geospatial technology, sensing, and data-driven engineering, with a curiosity for exploring new technologies and solving real-world problems.
  email: yuching_lai@berkeley.edu
  linkedin: https://www.linkedin.com/in/yu-ching-jessie-lai
  github: https://github.com/yc-jessie-lai

# Optional: path to a PDF of your CV, e.g. /assets/cv.pdf (leave empty to hide the link)
cv_pdf: ""

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

markdown: kramdown
exclude:
  - README.md
  - PROJECT_TEMPLATE.md
  - Gemfile
  - Gemfile.lock
